<script>
	const BUILD = "https://cdn.jsdelivr.net/gh/genizy/web-port@main/fears-to-fathom/home-alone/Build/";
	let max = 0;
	let done = 0;

	function setLoadingText(t) {
		const el = document.querySelector("#loading-text");
		if (el) el.textContent = t;
	}

	function getParts(file, start, end) {
		const parts = [];
		for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
		max += end - start + 1;
		return parts;
	}

	async function mergeFiles(fileParts) {
		const buffers = [];
		for (const part of fileParts) {
			const res = await fetch(part);
			if (!res.ok) throw new Error("Failed to fetch " + part + " (" + res.status + ")");
			buffers.push(await res.arrayBuffer());
			done++;
			setLoadingText(`LOADING... (${done}/${max})`);
		}
		return URL.createObjectURL(new Blob(buffers));
	}

	function resizeUnityContainer() {
		const c = document.getElementById("unityContainer");
		c.style.width = window.innerWidth + "px";
		c.style.height = window.innerHeight + "px";
	}

	window.addEventListener("DOMContentLoaded", async () => {
		try {
			const dataUrl = await mergeFiles(getParts(BUILD + "FTFHAPort.data.unityweb", 1, 39));

			const json = {
				companyName: "Rayll",
				productName: "Fears To Fathom",
				dataUrl: dataUrl, // merged blob, not the missing single file
				wasmCodeUrl: BUILD + "FTFHAPort.wasm.code.unityweb",
				wasmFrameworkUrl: BUILD + "FTFHAPort.wasm.framework.unityweb",
				TOTAL_MEMORY: 536870912,
				graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
				webglContextAttributes: { preserveDrawingBuffer: false },
				splashScreenStyle: "Dark",
				backgroundColor: "#231F20",
				cacheControl: { default: "must-revalidate" },
			};

			const manifestUrl = URL.createObjectURL(
				new Blob([JSON.stringify(json)], { type: "application/json" })
			);

			window.addEventListener("resize", resizeUnityContainer);
			resizeUnityContainer();

			UnityLoader.instantiate("unityContainer", manifestUrl, {
				onProgress: (instance, progress) => {
					if (progress === 1) setLoadingText("");
				},
				Module: {
					onRuntimeInitialized: function () {
						resizeUnityContainer();
						const el = document.querySelector("#loading-text");
						if (el) el.remove();
					},
				},
			});
		} catch (e) {
			console.error(e);
			setLoadingText("Failed to load: " + e.message);
		}
	});
</script>
